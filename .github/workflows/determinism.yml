name: Determinism gate

# NOTE: the plain `dotnet test` half of this now ALSO runs in tests.yml on a
# hosted Ubuntu runner. That is not duplication for its own sake - this
# workflow never ran, because the self-hosted runner it requires was never
# registered, and a gate that cannot execute protects nothing. tests.yml gives
# every PR a check today; this job remains the only place the IL2CPP
# comparison and the Unity EditMode suite can run, and remains the gate.

# Proves the engine produces byte-identical results on both runtimes it
# actually ships on: CoreCLR (server/tools) and Unity's IL2CPP (client).
# See implementation/scripts/cross-runtime-diff.sh for how, and
# implementation/2026-09-09-phase1-engine-foundations.md Task 7 for why.
#
# Requires a SELF-HOSTED macOS runner, deliberately:
#   - GitHub-hosted macOS runners bill at a 10x minute multiplier versus
#     Linux, and this job builds a full IL2CPP player.
#   - Hosted runners carry no Unity installation and no Unity licence;
#     activating one on an ephemeral runner is itself a known source of
#     flaky builds.
#   See specs/plans/broodline_solo_execution.md Section 7.3.
#
# A self-hosted "macOS" runner also needs, on the machine itself: the .NET
# SDK, Unity 6000.6.0f1 with the macOS Build Support (IL2CPP) module, and an
# activated Unity licence. implementation/scripts/verify-prereqs.sh checks
# all of this and is the fast, readable way to confirm a runner is ready.
#
# Timeout: a COLD build (no warm client/Library cache — a brand-new runner,
# or the first run ever) takes roughly 10 minutes for the IL2CPP player
# alone, most of it one-time URP/Sentis shader-variant compilation. An
# incremental build is 19-36 seconds. 45 minutes leaves headroom for a fully
# cold runner plus normal checkout/restore/test overhead without masking a
# genuine hang.
#
# Fix round 2, Finding 7: this gate exists to stop a determinism regression
# from landing, and until now it had no `pull_request` trigger — so it never
# reported on the one event where a human decides whether to merge. It ran
# on push (i.e. after the fact, and on the branch rather than on the merge
# result) and nightly. `pull_request` runs it against the merge commit,
# which is the thing actually being integrated.
#
# The two triggers carry the SAME path filter, deliberately: this job builds
# a full IL2CPP player, and running it on documentation-only PRs would cost
# ~10 minutes of self-hosted runner time to prove nothing. The list is spelled
# out twice rather than shared via a YAML anchor — anchors are not a
# documented GitHub Actions feature, and a silently-unparsed filter here
# would either run this job on every PR or on none, both bad. Keep the two
# lists in step by hand; the file is short enough that a diff shows it.
#
# One consequence to know about if this is ever made a REQUIRED check in
# branch protection: a required check with a path filter stays permanently
# "expected" on PRs that do not touch these paths. Either leave it advisory,
# or pair it with a path-filtered no-op job of the same name.
on:
  # AUTOMATIC TRIGGERS ARE DISABLED, and this is not a filter tweak.
  #
  # This job declares `runs-on: [self-hosted, macOS]` and no such runner is
  # registered. GitHub had nothing to assign it to, so it did not fail - it
  # sat QUEUED for 5h34m and was cancelled by hand. On a pull request that
  # surfaces as a check that is permanently pending, which blocks a merge
  # under branch protection and, worse, reads to a human as "still running"
  # rather than "can never run".
  #
  # A check that cannot resolve is worse than an absent one for the same
  # reason the path filter below was widened: a board that reports something
  # other than the truth is trusted anyway.
  #
  # So the gate is MANUAL, which is what solo_execution 7.3 already asks for
  # - it prescribes running the corpus on a physical iPhone by hand before
  # each release, so a human is in this loop regardless.
  #
  # TO RE-ENABLE: register a self-hosted macOS runner with the .NET SDK,
  # Unity 6000.6.0f1 with macOS IL2CPP support and an activated licence, then
  # uncomment the push/pull_request/schedule blocks below. They are preserved
  # verbatim rather than deleted because their path lists encode two rounds of
  # review findings - including the false green where a PR touching only
  # IosFileSharingPostProcess.cs produced two passing checks without
  # compiling a line of it, and shipped a plist Apple's parser refuses.
  #
  # SECURITY, before re-enabling: this repository is now PUBLIC. A self-hosted
  # runner on a public repo executes fork pull-request code on the host
  # machine. Restrict fork runs, or use an ephemeral machine - not a daily
  # driver carrying an activated Unity licence and SSH keys.

  # push:
  #   paths:
  #     - 'engine/**'
  #     - 'tests/engine/**'
  #     # Fix round 1, Finding 3: the original two paths cover the simulation
  #     # code the corpus runs, but not the gate's own machinery — a change
  #     # here can silently gut the gate (softening the backend guard below is
  #     # exactly Finding 1's failure mode) and still land with a green board
  #     # if nothing watches these paths too.
  #     - 'client/Assets/Editor/DeterminismHarness.cs'
  #     - 'client/Assets/Determinism/**'
  #     - 'implementation/scripts/cross-runtime-diff.sh'
  #     - '.github/workflows/determinism.yml'
  #     - 'client/ProjectSettings/ProjectSettings.asset'
  #     - 'Broodline.sln'
  #     # Fix round 2, Finding 7: two more load-bearing paths that were
  #     # unwatched. manifest.json's `file:../../engine` line is the wire that
  #     # makes Unity compile the very same Broodline.Sim source CoreCLR runs —
  #     # repoint or drop it and IL2CPP is silently compiling something else,
  #     # or nothing, while the gate still reports on two files it believes are
  #     # one. ProjectVersion.txt matters because cross-runtime-diff.sh
  #     # hardcodes the editor path (6000.6.0f1): an editor upgrade lands here
  #     # and the script then fails preflight at exit 127, which is worth
  #     # learning from CI rather than from the next person to run it locally.
  #     - 'client/Packages/manifest.json'
  #     - 'client/ProjectSettings/ProjectVersion.txt'
  #     # ALL of client/Assets, not the two folders someone listed.
  #     #
  #     # This job is the only thing that COMPILES Unity C#, and the narrow
  #     # filter created a false green: a PR touching only
  #     # client/Assets/Editor/IosFileSharingPostProcess.cs triggered tests.yml
  #     # alone, which produced two passing checks - one of them named "Unity
  #     # settings" - without compiling a line of the changed file. That is worse
  #     # than no checks at all, because a green check reads as coverage. It cost
  #     # exactly that: the plist rewrite shipped a file Apple's parser refuses,
  #     # and nothing in CI could have said so.
  #     #
  #     # It costs a full self-hosted run on an Editor-only change; that is the
  #     # correct trade when the alternative is a check that lies.
  #     - 'client/Assets/**'
  #     # The scripts this job runs.
  #     - 'implementation/scripts/run-unity-tests.sh'
  # pull_request:
  #   paths:
  #     - 'engine/**'
  #     - 'tests/engine/**'
  #     - 'client/Assets/Editor/DeterminismHarness.cs'
  #     - 'client/Assets/Determinism/**'
  #     - 'implementation/scripts/cross-runtime-diff.sh'
  #     - '.github/workflows/determinism.yml'
  #     - 'client/ProjectSettings/ProjectSettings.asset'
  #     - 'Broodline.sln'
  #     - 'client/Packages/manifest.json'
  #     - 'client/ProjectSettings/ProjectVersion.txt'
  #     # ALL of client/Assets, not the two folders someone listed.
  #     #
  #     # This job is the only thing that COMPILES Unity C#, and the narrow
  #     # filter created a false green: a PR touching only
  #     # client/Assets/Editor/IosFileSharingPostProcess.cs triggered tests.yml
  #     # alone, which produced two passing checks - one of them named "Unity
  #     # settings" - without compiling a line of the changed file. That is worse
  #     # than no checks at all, because a green check reads as coverage. It cost
  #     # exactly that: the plist rewrite shipped a file Apple's parser refuses,
  #     # and nothing in CI could have said so.
  #     #
  #     # It costs a full self-hosted run on an Editor-only change; that is the
  #     # correct trade when the alternative is a check that lies.
  #     - 'client/Assets/**'
  #     # The scripts this job runs.
  #     - 'implementation/scripts/run-unity-tests.sh'
  # schedule:
  #   # Nightly at 09:00 UTC.
  #   - cron: '0 9 * * *'

  workflow_dispatch: {}

jobs:
  cross-runtime-determinism:
    name: Cross-runtime determinism (CoreCLR vs IL2CPP)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: dotnet test
        run: dotnet test Broodline.sln

      # Phase 3 added 24 EditMode tests, including the accumulator contract -
      # a dropped frame never drops a tick, a stall past the cap runs slow
      # rather than skipping, and a Rally between boundaries records the NEXT
      # tick index. None of it was run by CI. It needs Unity and a licence, so
      # this is the only job that can host it.
      #
      # Before the IL2CPP diff, not after: the diff switches the active build
      # target to StandaloneOSX and back, and a test run either side of that
      # is slower and noisier than one before it.
      - name: Unity EditMode tests
        run: ./implementation/scripts/run-unity-tests.sh EditMode

      - name: Cross-runtime determinism diff
        run: ./implementation/scripts/cross-runtime-diff.sh
