<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e4dff0; font-family: "Nunito", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .lbl { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #a29bb5; }
  @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes riseIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes tapPing { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.7); opacity: 0; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: orbit 20s linear infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: tapPing 1.7s ease-out infinite; }
</style>
</helmet>

<div style="min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; background: linear-gradient(160deg, #e6e0f5, #d3e7ef);">
<div style="width: 430px; height: 932px; background: #f7f4fb; color: #3f3a52; border-radius: 34px; box-shadow: 0 18px 50px rgba(63,58,82,.28); display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 2px; font-size: 12px; font-weight: 800; color: #a29bb5;">
    <span>9:41</span>
    <span style="display: flex; gap: 7px;"><span>◦◦◦</span><span>84%</span></span>
  </div>

  <div style="display: flex; align-items: center; gap: 9px; padding: 10px 16px 12px;">
    <span style="flex: 1; height: 5px; border-radius: 999px; background: {{ p1 }};"></span>
    <span style="flex: 1; height: 5px; border-radius: 999px; background: {{ p2 }};"></span>
    <span style="flex: 1; height: 5px; border-radius: 999px; background: {{ p3 }};"></span>
    <span style="flex: 1; height: 5px; border-radius: 999px; background: {{ p4 }};"></span>
    <span style="flex: 1; height: 5px; border-radius: 999px; background: {{ p5 }};"></span>
    <span style="font-size: 10.5px; font-weight: 800; color: #a29bb5; white-space: nowrap;">{{ stepLabel }}</span>
  </div>

  <div style="position: relative; flex: 1; min-height: 300px; margin: 0 12px; background: linear-gradient(170deg, #ffffff, #efe9fb); border-radius: 26px; box-shadow: 0 4px 16px rgba(63,58,82,.08); overflow: hidden;">
    <svg viewBox="0 0 406 336" style="position: absolute; inset: 0;">
      <g class="spin" fill="none" stroke="#dcd2f3" stroke-width="1.6" stroke-dasharray="4 12"><circle cx="203" cy="168" r="132"></circle></g>
      <circle cx="203" cy="168" r="98" fill="#e9e0fb" style="animation: glow 3.6s ease-in-out infinite;"></circle>
    </svg>

    <sc-if value="{{ isS1 }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0; display: grid; place-items: center; animation: riseIn .4s ease-out;">
        <svg viewBox="0 0 240 240" width="240" height="240" style="animation: bob 4s ease-in-out infinite;">
          <ellipse cx="120" cy="206" rx="62" ry="13" fill="#3f3a52" opacity=".12"></ellipse>
          <path d="M120 56 L200 100 L200 160 L120 204 L40 160 L40 100 Z" fill="#e9e3f7" stroke="#9c8ccf" stroke-width="3" stroke-linejoin="round"></path>
          <path d="M40 100 L120 144 L120 204 L40 160 Z" fill="#b6a9dc"></path>
          <path d="M200 100 L120 144 L120 204 L200 160 Z" fill="#cdc2e8"></path>
          <path d="M120 84 L152 102 L120 120 L88 102 Z" fill="#f3eefd" stroke="#9c8ccf" stroke-width="2"></path>
          <path d="M120 84 V60" stroke="#8878cf" stroke-width="3" stroke-linecap="round"></path>
          <circle cx="120" cy="54" r="7" fill="#8878cf" style="animation: glow 1.6s ease-in-out infinite;"></circle>
        </svg>
      </div>
    </sc-if>

    <sc-if value="{{ isS2 }}">
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; animation: riseIn .4s ease-out;">
        <div style="text-align: center;">
          <svg viewBox="0 0 40 40" width="92" height="92"><ellipse cx="20" cy="23" rx="10" ry="9" fill="#6ba7c0"></ellipse><circle cx="20" cy="11" r="5.2" fill="#6ba7c0"></circle><path d="M9 20 l-5 5 2 2 5-4 z M31 20 l5 5-2 2-5-4 z" fill="#6ba7c0"></path></svg>
          <div style="font-size: 11px; font-weight: 800; color: #3c7f98;">Vetch</div>
        </div>
        <div style="position: relative; width: 54px; height: 54px; display: grid; place-items: center;">
          <svg viewBox="0 0 54 54" width="54" height="54" style="position: absolute; inset: 0;">
            <circle class="ping" cx="27" cy="27" r="18" fill="none" stroke="#8878cf" stroke-width="3"></circle>
          </svg>
          <div style="position: relative; width: 40px; height: 40px; border-radius: 999px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(63,58,82,.14);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a6ac0" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 l12 12M18 6 L6 18"></path></svg>
          </div>
        </div>
        <div style="text-align: center;">
          <svg viewBox="0 0 40 40" width="88" height="88"><ellipse cx="20" cy="24" rx="8" ry="8" fill="#e5867a"></ellipse><circle cx="20" cy="13" r="5" fill="#e5867a"></circle><path d="M20 4 l3 6 h-6 z" fill="#e5867a"></path></svg>
          <div style="font-size: 11px; font-weight: 800; color: #b3564a;">Ember</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isS3 }}">
      <div style="position: absolute; inset: 0; animation: riseIn .4s ease-out;">
        <svg viewBox="0 0 406 336" style="position: absolute; inset: 0;">
          <path d="M-20 90 C90 76, 120 190, 240 200 C320 206, 360 250, 420 258" fill="none" stroke="#eee5d4" stroke-width="22" stroke-linecap="round"></path>
          <path d="M-20 90 C90 76, 120 190, 240 200 C320 206, 360 250, 420 258" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 9"></path>
          <g transform="translate(300 130)">
            <circle class="ping" cx="0" cy="0" r="26" fill="none" stroke="#8878cf" stroke-width="3"></circle>
            <rect x="-27" y="-27" width="54" height="54" rx="16" fill="#ffffff" opacity=".92"></rect>
            <path d="M0 -12 v24M-12 0 h24" stroke="#7a6ac0" stroke-width="3" stroke-linecap="round"></path>
          </g>
          <g transform="translate(120 128)">
            <ellipse cx="0" cy="26" rx="18" ry="5" fill="#3f3a52" opacity=".12"></ellipse>
            <ellipse cx="0" cy="6" rx="17" ry="15" fill="#8d84a8"></ellipse>
            <circle cx="0" cy="-14" r="9" fill="#8d84a8"></circle>
          </g>
          <g transform="translate(360 262)">
            <path d="M0 -20 L24 -8 v22 L0 28 L-24 16 v-22 Z" fill="#bdb0e4" stroke="#7a6ac0" stroke-width="2.4" stroke-linejoin="round"></path>
          </g>
        </svg>
      </div>
    </sc-if>

    <sc-if value="{{ isS4 }}">
      <div style="position: absolute; inset: 0; animation: riseIn .4s ease-out;">
        <svg viewBox="0 0 406 336" style="position: absolute; inset: 0;">
          <path d="M40 60 L180 44 L230 130 L120 176 L28 132 Z" fill="#cadaa6"></path>
          <path d="M180 44 L340 62 L376 150 L230 130 Z" fill="#86cc9f"></path>
          <path d="M120 176 L230 130 L300 240 L170 288 L70 240 Z" fill="#ded0b6"></path>
          <path d="M230 130 L376 150 L360 268 L300 240 Z" fill="#f6c559"></path>
          <g fill="none" stroke="#ffffff" stroke-width="2.5">
            <path d="M40 60 L180 44 L340 62 L376 150 L360 268 L300 240 L170 288 L70 240 L28 132 Z"></path>
            <path d="M180 44 L230 130 L376 150M120 176 L230 130 L300 240M28 132 L120 176 L70 240"></path>
          </g>
          <g transform="translate(120 150)">
            <ellipse cx="0" cy="20" rx="16" ry="5" fill="#3f3a52" opacity=".14"></ellipse>
            <circle cx="0" cy="0" r="16" fill="#ffffff"></circle>
            <circle cx="0" cy="0" r="12" fill="#7a6ac0"></circle>
          </g>
          <g transform="translate(312 198)">
            <circle class="ping" cx="0" cy="0" r="20" fill="none" stroke="#d19a1f" stroke-width="3"></circle>
            <circle cx="0" cy="0" r="13" fill="#ffffff"></circle>
            <circle cx="0" cy="0" r="9" fill="#ffb703"></circle>
          </g>
          <path d="M136 150 C200 156, 250 180, 296 194" fill="none" stroke="#7f6fc4" stroke-width="2.6" stroke-dasharray="8 7" stroke-linecap="round"></path>
        </svg>
      </div>
    </sc-if>

    <sc-if value="{{ isS5 }}">
      <div style="position: absolute; inset: 0; display: grid; place-items: center; animation: riseIn .4s ease-out;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
          <div style="width: 62px; height: 62px; border-radius: 20px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(63,58,82,.1);">
            <svg viewBox="0 0 40 40" width="34" height="34"><ellipse cx="20" cy="23" rx="10" ry="9" fill="#7cc492"></ellipse><circle cx="20" cy="11" r="5.2" fill="#7cc492"></circle></svg>
          </div>
          <div style="width: 62px; height: 62px; border-radius: 20px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(63,58,82,.1);">
            <svg viewBox="0 0 40 40" width="34" height="34"><path d="M20 15 c7 0 12 4 12 9 s-5 8-12 8 -12-3-12-8 5-9 12-9 z" fill="#7a6ac0"></path><circle cx="20" cy="9.5" r="5.6" fill="#7a6ac0"></circle></svg>
          </div>
          <div style="width: 62px; height: 62px; border-radius: 20px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(63,58,82,.1);">
            <svg viewBox="0 0 40 40" width="34" height="34"><ellipse cx="20" cy="24" rx="8" ry="8" fill="#6ba7c0"></ellipse><circle cx="20" cy="13" r="5" fill="#6ba7c0"></circle></svg>
          </div>
          <div style="width: 62px; height: 62px; border-radius: 20px; background: #f4f0fd; display: grid; place-items: center; box-shadow: inset 0 0 0 2px #cbbdf2;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a6ac0" stroke-width="2.6" stroke-linecap="round"><path d="M12 6 v12M6 12 h12"></path></svg>
          </div>
          <div style="width: 62px; height: 62px; border-radius: 20px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(63,58,82,.1);">
            <svg viewBox="0 0 40 40" width="34" height="34"><ellipse cx="20" cy="24" rx="8" ry="8" fill="#e5867a"></ellipse><circle cx="20" cy="13" r="5" fill="#e5867a"></circle></svg>
          </div>
          <div style="width: 62px; height: 62px; border-radius: 20px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(63,58,82,.1);">
            <svg viewBox="0 0 40 40" width="34" height="34"><ellipse cx="20" cy="23" rx="9.5" ry="9" fill="#c9a95f"></ellipse><circle cx="20" cy="11" r="5.2" fill="#c9a95f"></circle></svg>
          </div>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="flex: none; margin: 12px 12px 0; display: flex; flex-direction: column;">
    <div style="background: #ffffff; border-radius: 24px; padding: 15px 18px 17px; box-shadow: 0 2px 8px rgba(63,58,82,.06);">
      <div class="lbl">{{ kicker }}</div>
      <div style="font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.01em; margin-top: 3px;">{{ title }}</div>
      <div style="font-size: 13px; font-weight: 700; color: #5d5670; line-height: 1.45; margin-top: 7px;">{{ body }}</div>

      <div style="display: flex; align-items: center; gap: 10px; background: {{ noteBg }}; border-radius: 14px; padding: 10px 12px; margin-top: 13px;">
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #ffffff; display: grid; place-items: center; flex: none;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ noteStroke }}" stroke-width="2.5" stroke-linecap="round"><path d="M5 13 l4 4 10-10"></path></svg>
        </span>
        <span style="flex: 1; font-size: 11.5px; font-weight: 700; color: {{ noteText }}; line-height: 1.35;">{{ note }}</span>
      </div>
    </div>

    <div style="flex: none; margin-top: 10px; background: #ffffff; border-radius: 22px; padding: 12px 16px 14px; box-shadow: 0 2px 8px rgba(63,58,82,.06);">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span class="lbl">First hour checklist</span>
        <span style="font-size: 10px; font-weight: 700; color: #a29bb5;">{{ doneLabel }}</span>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 5px; margin-top: 10px;">
        <div style="flex: 1; display: grid; justify-items: center; gap: 5px;">
          <span style="width: 22px; height: 22px; border-radius: 8px; background: {{ ck1bg }}; display: grid; place-items: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ ck1fg }}" stroke-width="3.4" stroke-linecap="round"><path d="M5 13 l4 4 10-10"></path></svg>
          </span>
          <span style="font-size: 9.5px; font-weight: 800; color: {{ ck1tx }};">Ark</span>
        </div>
        <div style="flex: 1; display: grid; justify-items: center; gap: 5px;">
          <span style="width: 22px; height: 22px; border-radius: 8px; background: {{ ck2bg }}; display: grid; place-items: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ ck2fg }}" stroke-width="3.4" stroke-linecap="round"><path d="M5 13 l4 4 10-10"></path></svg>
          </span>
          <span style="font-size: 9.5px; font-weight: 800; color: {{ ck2tx }};">Splice</span>
        </div>
        <div style="flex: 1; display: grid; justify-items: center; gap: 5px;">
          <span style="width: 22px; height: 22px; border-radius: 8px; background: {{ ck3bg }}; display: grid; place-items: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ ck3fg }}" stroke-width="3.4" stroke-linecap="round"><path d="M5 13 l4 4 10-10"></path></svg>
          </span>
          <span style="font-size: 9.5px; font-weight: 800; color: {{ ck3tx }};">Defend</span>
        </div>
        <div style="flex: 1; display: grid; justify-items: center; gap: 5px;">
          <span style="width: 22px; height: 22px; border-radius: 8px; background: {{ ck4bg }}; display: grid; place-items: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ ck4fg }}" stroke-width="3.4" stroke-linecap="round"><path d="M5 13 l4 4 10-10"></path></svg>
          </span>
          <span style="font-size: 9.5px; font-weight: 800; color: {{ ck4tx }};">Claim</span>
        </div>
        <div style="flex: 1; display: grid; justify-items: center; gap: 5px;">
          <span style="width: 22px; height: 22px; border-radius: 8px; background: {{ ck5bg }}; display: grid; place-items: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{ ck5fg }}" stroke-width="3.4" stroke-linecap="round"><path d="M5 13 l4 4 10-10"></path></svg>
          </span>
          <span style="font-size: 9.5px; font-weight: 800; color: {{ ck5tx }};">Ally</span>
        </div>
      </div>
    </div>

    <sc-if value="{{ showReward }}">
      <div style="margin-top: 9px; display: flex; align-items: center; gap: 11px; background: linear-gradient(100deg, #fdf0d0, #f9e0a8); border-radius: 18px; padding: 11px 13px; box-shadow: inset 0 0 0 1px rgba(196,150,45,.28);">
        <span style="width: 28px; height: 28px; border-radius: 999px; background: #ffffff; display: grid; place-items: center; flex: none; animation: glow 2s ease-in-out infinite;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d19a1f" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"></path></svg>
        </span>
        <div style="flex: 1; min-width: 0;">
          <div class="lbl" style="color: #b58a2b;">Starter reward</div>
          <div style="font-size: 12px; font-weight: 800; color: #7a5b12;">{{ reward }}</div>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; align-items: center; gap: 9px; padding: 11px 12px 8px;">
    <button type="button" onClick="{{ back }}" style="flex: none; width: 52px; border: 0; cursor: pointer; background: #f1ecfa; border-radius: 15px; padding: 15px 0; box-shadow: inset 0 0 0 1px #e3dbf3; display: grid; place-items: center; opacity: {{ backOpacity }};" style-active="transform: translateY(1px);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b5fa8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5 L7 12 l7 7"></path></svg>
    </button>
    <button type="button" onClick="{{ next }}" style="flex: 1; border: 0; cursor: pointer; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 17px; color: #ffffff; background: linear-gradient(180deg, #8878cf, #6f5fbb); border-radius: 15px; padding: 14px 0; box-shadow: 0 3px 0 #5b4d9e, 0 6px 14px rgba(111,95,187,.26);" style-hover="background: linear-gradient(180deg, #9585db, #7a6ac6);" style-active="transform: translateY(2px); box-shadow: 0 1px 0 #5b4d9e;">{{ cta }}</button>
  </div>

  <div style="text-align: center; padding: 0 24px 20px;">
    <span style="font-size: 11px; font-weight: 700; color: #a29bb5; cursor: pointer;">{{ footer }}</span>
  </div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:478,&quot;height&quot;:980}}">
const STEPS = [
  {
    kicker: "Step 1 of 5 · your base",
    title: "This is your Gene Ark",
    body: "Everything you build travels with it — lab, hatchery, walls. When the ground runs dry, the whole base moves.",
    note: "Nothing here is permanent. Packing up is the plan, not a failure.",
    noteBg: "#f1ecfa", noteStroke: "#7a6ac0", noteText: "#5d5670",
    cta: "Show me the lab", footer: "Skip the tour", reward: null
  },
  {
    kicker: "Step 2 of 5 · the core loop",
    title: "Splice two, get one",
    body: "Pick two creatures and the chamber makes a hybrid that inherits from both. Careful pairings compound over generations.",
    note: "Tap the join icon to splice Vetch with Ember — your first hybrid is free.",
    noteBg: "#f1ecfa", noteStroke: "#7a6ac0", noteText: "#5d5670",
    cta: "Splice them", footer: "Skip the tour", reward: null
  },
  {
    kicker: "Step 3 of 5 · defense",
    title: "Your hybrid holds the lane",
    body: "Waves walk a fixed path to your Ark. Place defenders in the pockets beside it — never on the road itself.",
    note: "Slot placed. Cinderplate will fire on anything that passes within range.",
    noteBg: "#eef7f1", noteStroke: "#5aa87a", noteText: "#3d6b52",
    cta: "Start the wave", footer: "Skip the tour", reward: "1 hybrid · 5 splice charges"
  },
  {
    kicker: "Step 4 of 5 · the world",
    title: "Richer ground is worth the move",
    body: "Veins deplete. Gold Apex Veins pay eight times base but burn out in days, and rivals can intercept your collectors on the way home.",
    note: "You are on a Rich Deposit. In four days it dries up — that is your cue to relocate.",
    noteBg: "#fdf6e6", noteStroke: "#d19a1f", noteText: "#7a5b12",
    cta: "Claim this region", footer: "Skip the tour", reward: null
  },
  {
    kicker: "Step 5 of 5 · alliances",
    title: "Nobody holds an Apex alone",
    body: "Allied Arks harvest the same region at full rate, cut each other's build timers, and ride escort on convoys under attack.",
    note: "Crux Collective has 13 open slots and two Arks already in your region.",
    noteBg: "#f1ecfa", noteStroke: "#7a6ac0", noteText: "#5d5670",
    cta: "Join Crux Collective", footer: "Find another alliance", reward: "Alliance gift · 300 Gene Shards"
  }
];

const ON = "#7a6ac0", OFF = "#e3dbf3";

class Component extends DCLogic {
  state = { i: 0 };
  renderVals() {
    const i = this.state.i;
    const s = STEPS[i];
    const bar = (n) => (n <= i ? ON : OFF);
    const ck = (n) => (n < i
      ? { bg: "#6cba8b", fg: "#ffffff", tx: "#3f3a52" }
      : n === i
        ? { bg: "#ece4fa", fg: "#7a6ac0", tx: "#6b5fa8" }
        : { bg: "#f2eff8", fg: "#dcd6e8", tx: "#b3adc2" });
    const c1 = ck(0), c2 = ck(1), c3 = ck(2), c4 = ck(3), c5 = ck(4);
    return {
      ...s,
      isS1: i === 0, isS2: i === 1, isS3: i === 2, isS4: i === 3, isS5: i === 4,
      doneLabel: i + " of 5 done",
      backOpacity: i === 0 ? "0.4" : "1",
      ck1bg: c1.bg, ck1fg: c1.fg, ck1tx: c1.tx,
      ck2bg: c2.bg, ck2fg: c2.fg, ck2tx: c2.tx,
      ck3bg: c3.bg, ck3fg: c3.fg, ck3tx: c3.tx,
      ck4bg: c4.bg, ck4fg: c4.fg, ck4tx: c4.tx,
      ck5bg: c5.bg, ck5fg: c5.fg, ck5tx: c5.tx,
      stepLabel: (i + 1) + " / 5",
      p1: bar(0), p2: bar(1), p3: bar(2), p4: bar(3), p5: bar(4),
      showReward: !!s.reward,
      next: () => this.setState((st) => ({ i: st.i < 4 ? st.i + 1 : 0 })),
      back: () => this.setState((st) => ({ i: st.i > 0 ? st.i - 1 : 0 }))
    };
  }
}
</script>
</body>
</html>
