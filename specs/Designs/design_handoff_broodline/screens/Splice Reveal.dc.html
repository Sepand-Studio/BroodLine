<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; background: #e4dff0; font-family: "Nunito", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .lbl { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #a29bb5; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes burst { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes riseIn { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes sparkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes shakePod { 0%, 100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-1.5px,0) rotate(-1deg); } 75% { transform: translate(1.5px,0) rotate(1deg); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: orbit 16s linear infinite; }
  .spark { transform-box: fill-box; transform-origin: center; animation: sparkle 2.2s ease-in-out infinite; }
  .ring { transform-box: fill-box; transform-origin: center; animation: burst 1.9s ease-out infinite; }
</style>
</helmet>

<div style="min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; background: linear-gradient(160deg, #e6e0f5, #d3e7ef);">
<div style="width: 430px; height: 932px; background: #f7f4fb; color: #3f3a52; border-radius: 34px; box-shadow: 0 18px 50px rgba(63,58,82,.28); display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 2px; font-size: 12px; font-weight: 800; color: #a29bb5;">
    <span>9:41</span>
    <span style="display: flex; gap: 7px;"><span>◦◦◦</span><span>84%</span></span>
  </div>

  <div style="text-align: center; padding: 10px 24px 0;">
    <div class="lbl">{{ kicker }}</div>
    <div style="font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.01em; margin-top: 2px;">{{ headline }}</div>
  </div>

  <div style="position: relative; margin: 10px 12px 0; height: 372px; background: linear-gradient(170deg, #ffffff, #efe9fb); border-radius: 26px; box-shadow: 0 4px 16px rgba(63,58,82,.08); overflow: hidden;">
    <svg viewBox="0 0 406 372" style="position: absolute; inset: 0;">
      <g class="spin" fill="none" stroke="#d8cdf2" stroke-width="1.6" stroke-dasharray="4 12"><circle cx="203" cy="176" r="140"></circle></g>
      <circle cx="203" cy="176" r="106" fill="#e9e0fb" style="animation: glow 3.4s ease-in-out infinite;"></circle>
      <g fill="#ffffff">
        <circle class="spark" cx="96" cy="104" r="4"></circle>
        <circle class="spark" cx="310" cy="128" r="3.4" style="animation-delay: .7s;"></circle>
        <circle class="spark" cx="128" cy="266" r="3.6" style="animation-delay: 1.3s;"></circle>
        <circle class="spark" cx="296" cy="252" r="4.2" style="animation-delay: 1.9s;"></circle>
      </g>
    </svg>

    <sc-if value="{{ sealed }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0; display: grid; place-items: center;">
        <div style="text-align: center;">
          <svg viewBox="0 0 200 240" width="200" height="240" style="display: block; margin: 0 auto; animation: shakePod 1.1s ease-in-out infinite;">
            <ellipse cx="100" cy="222" rx="46" ry="10" fill="#3f3a52" opacity=".12"></ellipse>
            <path d="M100 26 C146 26, 168 78, 168 124 C168 176, 138 210, 100 210 C62 210, 32 176, 32 124 C32 78, 54 26, 100 26 Z" fill="#cdc4e8" stroke="#9c8ccf" stroke-width="3"></path>
            <path d="M100 26 C126 26, 142 60, 148 100 C120 112, 80 112, 52 100 C58 60, 74 26, 100 26 Z" fill="#e6dcfa"></path>
            <path d="M100 34 V202" stroke="#8878cf" stroke-width="2.6" stroke-dasharray="9 7" opacity=".8"></path>
            <g fill="#ffffff" opacity=".9">
              <circle cx="100" cy="120" r="17"></circle>
            </g>
            <circle cx="100" cy="120" r="11" fill="#8878cf" style="animation: glow 1.4s ease-in-out infinite;"></circle>
          </svg>
          <div style="font-size: 12px; font-weight: 800; color: #6b5fa8; margin-top: 4px;">Gene pod sealed · tap to crack</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ revealed }}">
      <div style="position: absolute; inset: 0; display: grid; place-items: center; animation: riseIn .45s ease-out;">
        <svg viewBox="0 0 406 372" style="position: absolute; inset: 0;">
          <circle class="ring" cx="203" cy="168" r="60" fill="none" stroke="#ffd97e" stroke-width="4"></circle>
          <circle class="ring" cx="203" cy="168" r="60" fill="none" stroke="#c9bcf0" stroke-width="3" style="animation-delay: .9s;"></circle>
        </svg>
        <div style="position: relative; text-align: center;">
          <div style="width: 186px; height: 186px; margin: 0 auto; animation: bob 3.6s ease-in-out infinite;">
            <image-slot id="reveal-hybrid" shape="rounded" radius="28" placeholder="Hybrid art"></image-slot>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 7px; background: linear-gradient(100deg, #fdf0d0, #f9e0a8); border-radius: 999px; padding: 6px 13px; margin-top: 14px; box-shadow: inset 0 0 0 1px rgba(196,150,45,.3);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#d19a1f" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"></path></svg>
            <span style="font-size: 11px; font-weight: 800; letter-spacing: .06em; color: #7a5b12;">MUTATION ROLLED · ASHVEIL</span>
          </div>
          <div style="font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 30px; line-height: 1.1; margin-top: 8px;">Cinderplate</div>
          <div style="font-size: 11.5px; font-weight: 700; color: #a29bb5; margin-top: 1px;">Gen 7 · Vetch × Ember · Tier B+</div>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="flex: 1; margin: 11px 12px 0; background: #ffffff; border-radius: 22px; padding: 12px 16px 14px; box-shadow: 0 2px 8px rgba(63,58,82,.06); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span class="lbl">{{ traitsLabel }}</span>
      <span style="font-size: 10px; font-weight: 700; color: #a29bb5;">{{ traitsNote }}</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; margin-top: 10px;">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #6ba7c0; flex: none;"></span>
      <span style="flex: 1; font-size: 12px; font-weight: 800;">Carapace III</span>
      <span style="font-size: 10.5px; font-weight: 800; color: {{ tone1 }};">{{ trait1 }}</span>
    </div>
    <div style="height: 1px; background: #f4f1fa; margin: 8px 0;"></div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #e5867a; flex: none;"></span>
      <span style="flex: 1; font-size: 12px; font-weight: 800;">Cinder Spit</span>
      <span style="font-size: 10.5px; font-weight: 800; color: {{ tone2 }};">{{ trait2 }}</span>
    </div>
    <div style="height: 1px; background: #f4f1fa; margin: 8px 0;"></div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #e8b34a; flex: none;"></span>
      <span style="flex: 1; font-size: 12px; font-weight: 800;">Ashveil aura</span>
      <span style="font-size: 10.5px; font-weight: 800; color: {{ tone3 }};">{{ trait3 }}</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: {{ noteBg }}; border-radius: 13px; padding: 9px 11px; margin-top: 11px;">
      <span style="width: 22px; height: 22px; border-radius: 999px; background: #ffffff; display: grid; place-items: center; flex: none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ noteStroke }}" stroke-width="2.4" stroke-linecap="round"><path d="M12 3 v10M8 9 l4 4 4-4M5 19 h14"></path></svg>
      </span>
      <span style="flex: 1; font-size: 11px; font-weight: 700; color: {{ noteText }}; line-height: 1.35;">{{ noteBody }}</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 9px; padding: 11px 12px 8px;">
    <button type="button" onClick="{{ primary }}" style="flex: 1.4; border: 0; cursor: pointer; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 17px; color: #ffffff; background: linear-gradient(180deg, #8878cf, #6f5fbb); border-radius: 15px; padding: 14px 0; box-shadow: 0 3px 0 #5b4d9e, 0 6px 14px rgba(111,95,187,.28);" style-hover="background: linear-gradient(180deg, #9585db, #7a6ac6);" style-active="transform: translateY(2px); box-shadow: 0 1px 0 #5b4d9e;">{{ ctaLabel }}</button>
    <button type="button" onClick="{{ reset }}" style="flex: 1; border: 0; cursor: pointer; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 16px; color: #6b5fa8; background: #f1ecfa; border-radius: 15px; padding: 14px 0; box-shadow: inset 0 0 0 1px #e3dbf3;" style-hover="background: #eae3f7;" style-active="transform: translateY(1px);">{{ secondaryLabel }}</button>
  </div>

  <div style="text-align: center; padding: 0 24px 20px;">
    <span style="font-size: 11px; font-weight: 700; color: #a29bb5;">{{ footer }}</span>
  </div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:478,&quot;height&quot;:980}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const open = this.state.open;
    return {
      sealed: !open,
      revealed: open,
      kicker: open ? "Splice complete · charge spent" : "Splicing chamber · incubating",
      headline: open ? "A new line begins" : "Pod ready",
      traitsLabel: open ? "Inherited traits" : "Predicted traits",
      traitsNote: open ? "final" : "odds only",
      trait1: open ? "From Vetch" : "78%",
      trait2: open ? "From Ember" : "54%",
      trait3: open ? "Mutation" : "9%",
      tone1: open ? "#3c7f98" : "#a29bb5",
      tone2: open ? "#b3564a" : "#a29bb5",
      tone3: open ? "#8e6d15" : "#a29bb5",
      noteBg: open ? "#fdf6e6" : "#f1ecfa",
      noteStroke: open ? "#d19a1f" : "#7a6ac0",
      noteText: open ? "#7a5b12" : "#5d5670",
      noteBody: open
        ? "Ashveil is a mutation — it isn't in either parent, and it now passes down this line at 40% odds."
        : "Both parents are consumed on reveal. Their traits live on in the pedigree, not in the roster.",
      ctaLabel: open ? "Send to Hatchery" : "Crack the pod",
      secondaryLabel: open ? "Splice again" : "Wait",
      footer: open
        ? "Lineage updated — Vetch line now unbroken for seven generations."
        : "One Splice Charge is already committed to this pod.",
      primary: () => this.setState({ open: true }),
      reset: () => this.setState((s) => ({ open: !s.open }))
    };
  }
}
</script>
</body>
</html>
